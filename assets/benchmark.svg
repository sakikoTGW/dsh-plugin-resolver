<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Benchmark: manual agent path versus resolver">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0E1A"/>
      <stop offset="1" stop-color="#0C1226"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(950 40) scale(500 340)">
      <stop offset="0" stop-color="#4D6BFE" stop-opacity=".22"/>
      <stop offset="1" stop-color="#4D6BFE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".03" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#glow)"/>
  <rect width="1200" height="560" fill="url(#grid)"/>

  <text x="40" y="58" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#4D6BFE" letter-spacing="2">MEASURED, NOT ESTIMATED</text>
  <text x="40" y="104" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#F4F7FF">Same job, two paths</text>
  <text x="40" y="132" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#8E9BC4">install one ambiguous + one GitHub-only plugin · numbers from BENCHMARK.md / ABLATION.md</text>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5">
    <rect x="800" y="56" width="14" height="14" rx="3" fill="#33415E"/>
    <text x="822" y="68" fill="#8E9BC4">manual agent path</text>
    <rect x="970" y="56" width="14" height="14" rx="3" fill="#4D6BFE"/>
    <text x="992" y="68" fill="#8E9BC4">resolver</text>
  </g>

  <!-- rows -->
  <g>
    <!-- catalog -->
    <text x="40" y="186" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#E6EDF3">Catalog fetch</text>
    <text x="40" y="206" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#5F6B85">seconds</text>
    <rect x="250" y="170" width="560" height="16" rx="8" fill="#33415E"/>
    <text x="822" y="183" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8E9BC4">91.06 s</text>
    <rect x="250" y="194" width="10" height="16" rx="5" fill="#4D6BFE"/>
    <text x="272" y="207" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#7FA0FF">0.94 s</text>
    <rect x="980" y="170" width="170" height="40" rx="20" fill="#0F2418" stroke="#1E4A2E"/>
    <text x="1065" y="195" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7EE0A1">97× faster</text>
    <line x1="40" y1="234" x2="1160" y2="234" stroke="#ffffff" stroke-opacity=".05"/>

    <!-- registry -->
    <text x="40" y="276" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#E6EDF3">Registry metadata</text>
    <text x="40" y="296" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#5F6B85">milliseconds</text>
    <rect x="250" y="260" width="560" height="16" rx="8" fill="#33415E"/>
    <text x="822" y="273" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8E9BC4">784 ms (npmjs)</text>
    <rect x="250" y="284" width="10" height="16" rx="5" fill="#4D6BFE"/>
    <text x="272" y="297" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#7FA0FF">13 ms (mirror)</text>
    <rect x="980" y="260" width="170" height="40" rx="20" fill="#0F2418" stroke="#1E4A2E"/>
    <text x="1065" y="285" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7EE0A1">60.3× faster</text>
    <line x1="40" y1="324" x2="1160" y2="324" stroke="#ffffff" stroke-opacity=".05"/>

    <!-- calls -->
    <text x="40" y="366" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#E6EDF3">Tool calls</text>
    <text x="40" y="386" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#5F6B85">count</text>
    <rect x="250" y="350" width="560" height="16" rx="8" fill="#33415E"/>
    <text x="822" y="363" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8E9BC4">45</text>
    <rect x="250" y="374" width="75" height="16" rx="8" fill="#4D6BFE"/>
    <text x="337" y="387" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#7FA0FF">6</text>
    <rect x="980" y="350" width="170" height="40" rx="20" fill="#0F2418" stroke="#1E4A2E"/>
    <text x="1065" y="375" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7EE0A1">−87%</text>
    <line x1="40" y1="414" x2="1160" y2="414" stroke="#ffffff" stroke-opacity=".05"/>

    <!-- time -->
    <text x="40" y="456" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#E6EDF3">End-to-end time</text>
    <text x="40" y="476" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#5F6B85">including install / build</text>
    <rect x="250" y="440" width="560" height="16" rx="8" fill="#33415E"/>
    <text x="822" y="453" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#8E9BC4">20–25 min</text>
    <rect x="250" y="464" width="75" height="16" rx="8" fill="#4D6BFE"/>
    <text x="337" y="477" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#7FA0FF">≈ 3 min</text>
    <rect x="980" y="440" width="170" height="40" rx="20" fill="#0F2418" stroke="#1E4A2E"/>
    <text x="1065" y="465" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7EE0A1">−80%+</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12">
    <text x="40" y="520" fill="#5F6B85">decision chain: 1.23 s across 9 tasks · 0 failed retries · 0 extra probes</text>
    <text x="1160" y="520" text-anchor="end" fill="#5F6B85">read the method: BENCHMARK.md</text>
  </g>
</svg>
