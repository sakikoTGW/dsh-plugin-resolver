<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="One tool call: search, resolve, install, verify, report">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0E1A"/>
      <stop offset=".55" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#0C1226"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 60) scale(520 340)">
      <stop offset="0" stop-color="#4D6BFE" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4D6BFE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 540) scale(460 320)">
      <stop offset="0" stop-color="#7C4DFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#4D6BFE"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#glow1)"/>
  <rect width="1200" height="560" fill="url(#glow2)"/>
  <rect width="1200" height="560" fill="url(#grid)"/>

  <text x="40" y="58" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#4D6BFE" letter-spacing="2">ONE TOOL CALL</text>
  <text x="40" y="102" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#F4F7FF">Search → resolve → install → verify → report</text>
  <text x="40" y="130" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8E9BC4">the agent never has to guess a version, a source, or whether the install actually mounted</text>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">
    <!-- card 1 -->
    <g>
      <rect x="40" y="170" width="200" height="190" rx="14" fill="#0D1220" stroke="#22305C"/>
      <circle cx="64" cy="196" r="13" fill="#4D6BFE"/>
      <text x="64" y="201" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
      <text x="88" y="201" font-size="14" fill="#A9B8E8">plugin_search</text>
      <text x="60" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#C9D3EA">Find the entry.</text>
      <text x="60" y="268" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8E9BC4">Same-name owners stay</text>
      <text x="60" y="288" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8E9BC4">visible instead of guessed.</text>
      <rect x="60" y="318" width="94" height="24" rx="12" fill="#121A30" stroke="#2A3864"/>
      <text x="72" y="334" font-size="11.5" fill="#7FC8FF">read-only</text>
    </g>
    <!-- card 2 -->
    <g>
      <rect x="270" y="170" width="200" height="190" rx="14" fill="#0D1220" stroke="#22305C"/>
      <circle cx="294" cy="196" r="13" fill="#4D6BFE"/>
      <text x="294" y="201" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
      <text x="318" y="201" font-size="14" fill="#A9B8E8">plugin_resolve</text>
      <text x="290" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#C9D3EA">Solve the version.</text>
      <text x="290" y="268" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8E9BC4">Non-optional dsh* peers</text>
      <text x="290" y="288" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8E9BC4">+ engines.dsh must accept.</text>
      <rect x="290" y="318" width="94" height="24" rx="12" fill="#121A30" stroke="#2A3864"/>
      <text x="302" y="334" font-size="11.5" fill="#7FC8FF">read-only</text>
    </g>
    <!-- card 3 -->
    <g>
      <rect x="500" y="170" width="200" height="190" rx="14" fill="#0D1220" stroke="#22305C"/>
      <circle cx="524" cy="196" r="13" fill="#D29922"/>
      <text x="524" y="201" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1200">3</text>
      <text x="548" y="201" font-size="14" fill="#A9B8E8">plugin_install</text>
      <text x="520" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#C9D3EA">Put it on disk.</text>
      <text x="520" y="268" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8E9BC4">Fastest registry, or</text>
      <text x="520" y="288" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8E9BC4">GitHub source build.</text>
      <rect x="520" y="318" width="118" height="24" rx="12" fill="#2A2112" stroke="#5C4A1E"/>
      <text x="532" y="334" font-size="11.5" fill="#E8C468">writes profile</text>
    </g>
    <!-- card 4 -->
    <g>
      <rect x="730" y="170" width="200" height="190" rx="14" fill="#0D1220" stroke="#22305C"/>
      <circle cx="754" cy="196" r="13" fill="#2FBF71"/>
      <text x="754" y="201" text-anchor="middle" font-size="13" font-weight="700" fill="#04140A">4</text>
      <text x="778" y="201" font-size="14" fill="#A9B8E8">verify</text>
      <text x="750" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#C9D3EA">Read it back.</text>
      <text x="750" y="268" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8E9BC4">Loader entry, bundle,</text>
      <text x="750" y="288" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8E9BC4">client half.</text>
      <rect x="750" y="318" width="124" height="24" rx="12" fill="#0F2418" stroke="#1E4A2E"/>
      <text x="762" y="334" font-size="11.5" fill="#7EE0A1">read-back check</text>
    </g>
    <!-- card 5 -->
    <g>
      <rect x="960" y="170" width="200" height="190" rx="14" fill="#0D1220" stroke="#22305C"/>
      <circle cx="984" cy="196" r="13" fill="#4D6BFE"/>
      <text x="984" y="201" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
      <text x="1008" y="201" font-size="14" fill="#A9B8E8">report</text>
      <text x="980" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#C9D3EA">Tell the truth.</text>
      <text x="980" y="268" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8E9BC4">Refresh, restart, or</text>
      <text x="980" y="288" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8E9BC4">already active.</text>
      <rect x="980" y="318" width="94" height="24" rx="12" fill="#121A30" stroke="#2A3864"/>
      <text x="992" y="334" font-size="11.5" fill="#7FC8FF">no guesses</text>
    </g>
  </g>

  <g stroke="#4D6BFE" stroke-width="2" marker-end="url(#arrow)" fill="none">
    <line x1="242" y1="265" x2="264" y2="265"/>
    <line x1="472" y1="265" x2="494" y2="265"/>
    <line x1="702" y1="265" x2="724" y2="265"/>
    <line x1="932" y1="265" x2="954" y2="265"/>
  </g>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="270" y="404" width="430" height="86" rx="12" fill="#1A1408" stroke="#4A3A14"/>
    <text x="292" y="436" font-size="13.5" font-weight="600" fill="#E8C468">No compatible version?</text>
    <text x="292" y="460" font-size="13" fill="#B9A977">List the rejected versions and the host each one needs — never guess.</text>

    <rect x="730" y="404" width="430" height="86" rx="12" fill="#0F2418" stroke="#1E4A2E"/>
    <text x="752" y="436" font-size="13.5" font-weight="600" fill="#7EE0A1">Installed but not mounted?</text>
    <text x="752" y="460" font-size="13" fill="#8FC7A4">Report the silent failure instead of claiming success.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="12.5">
    <circle cx="46" cy="524" r="5" fill="#4D6BFE"/>
    <text x="60" y="529" fill="#8E9BC4">read-only</text>
    <circle cx="166" cy="524" r="5" fill="#D29922"/>
    <text x="180" y="529" fill="#8E9BC4">writes the profile</text>
    <circle cx="352" cy="524" r="5" fill="#2FBF71"/>
    <text x="366" y="529" fill="#8E9BC4">read-back verification</text>
    <text x="1160" y="529" text-anchor="end" fill="#5F6B85">DSH · plugin resolver</text>
  </g>
</svg>
