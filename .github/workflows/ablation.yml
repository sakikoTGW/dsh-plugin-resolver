name: ablation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ablation (real catalog, real registry, no side effects)
        run: node test/ablation.mjs
